name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enforce VitePress-only sources
        run: |
          # Scoped to the Markdown sources: docs/public holds static assets a
          # page may legitimately need, and dist is build output.
          if find docs \
               -path docs/public -prune -o \
               -path docs/.vitepress/dist -prune -o \
               -type f \( -name '*.html' -o -name '*.htm' \) -print | grep -q .; then
            echo 'Legacy HTML files are not allowed; author pages in VitePress Markdown.'
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
