name: Archive research release

# A release is a citable research milestone, not a deployment. Starting this
# workflow validates the exact main-branch revision and publishes a GitHub
# Release. When this repository is enabled in Zenodo's GitHub integration,
# Zenodo receives that release and issues the DOI on its side.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Milestone version (for example 2026.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: research-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^20[0-9]{2}\.[1-9][0-9]*$'; then
            echo 'Use a milestone version such as 2026.1.'
            exit 1
          fi

          tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists. Published research releases are immutable."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the research and built site
        run: npm run check

      - name: Check the domain can still move
        run: npm run check:origin

  release:
    name: Approve and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    environment: zenodo-release
    steps:
      - name: Checkout the approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Solo Titania Chaos $VERSION" \
            --generate-notes \
            --notes "Citable research milestone for Solo Titania Chaos. Zenodo archives this GitHub release and assigns its DOI after ingestion."
